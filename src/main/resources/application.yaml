spring:
  application:
    name: NEPE

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nepe_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:fede}
    password: ${DB_PASSWORD:3002FedericO2003}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: NepeHikariPool

  jpa:
    hibernate:
      ddl-auto: none # Usiamo schema.sql per il controllo DDL esplicito
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
